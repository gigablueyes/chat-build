services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbuild
      POSTGRES_PASSWORD: chatbuild
      POSTGRES_DB: chatbuild
    ports:
      - "5432:5432"
    volumes:
      - chatbuild-db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql://chatbuild:chatbuild@db:5432/chatbuild
      LLM_PROVIDER: mock
      SECRET_KEY: dev-only-secret-change-me
    ports:
      - "8000:8000"

volumes:
  chatbuild-db-data:
